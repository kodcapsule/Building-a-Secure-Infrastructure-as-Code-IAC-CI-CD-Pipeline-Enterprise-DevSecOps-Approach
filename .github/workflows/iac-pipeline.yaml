name: Terraform CI/CD Pipeline to deploy EKS infrastructure 

on:
  workflow_run: # Triggered when manually triggered from the Actions tab
    workflows: ["Scan hardcoded secrets with Gitleaks"] # Name of the workflow that
    types:
      - completed
  push:
    branches:
      - infra
    paths:
        - 'infra/**'  
  
  pull_request:
    branches:
      - main      
    paths:
        - 'infra/**'

env:
  TF_LOG: INFO
  TF_LOG_PATH: terraform.log
  TF_VERSION: 1.13.3 
  TF_WORKING_DIR: ./infra
  AWS_REGION: us-east-1

 
permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:

#####################################
  #  Format/Lint & Validation
#####################################
  formatting-validate-linting:
    runs-on: ubuntu-latest
    name: 'Formatting, Linting, and Validation'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v2      

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
     
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color        
     
      - name: Terraform lint
        id: tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          version: latest
          cache: true
          
      - name: show tflint version
        id: tflint-version
        run: tflint --version

      - name: Initialize TFLint (install plugins)
        id: tflint-init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      
      - name: Run TFLint
        id: tflint-run
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --format compact
        continue-on-error: true
      
      - name: Upload TFLint Report
        uses: actions/upload-artifact@v4 
        with:
          name: tflint-report-${{ github.sha }}  
          path: ${{ env.TF_WORKING_DIR }}/tflint-report.json  
          if-no-files-found: warn
  
      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('infrastructure/.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-
  
############################################################################
  # Static Code Analysis (SAST) and Dependency/Module Scanning
#############################################################################
  Security-Scan:
    runs-on: ubuntu-latest
    name: 'Static Code Analysis and Dependency/Module Scanning' 
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run tfsec Security Scanner
        id: tfsec-scan
        uses:  aquasecurity/tfsec-action@v1.0.0       
        with:
           sarif_file: tfsec.sarif
           soft_fail: true
           github_token: ${{ secrets.GITHUB_TOKEN }}      
   
      - name: tfsec PR Commenter
        uses: tfsec/tfsec-pr-commenter-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: run checkov scan
        id: checkov-scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: 'json'          
          output_file_path: 'checkov-report.json'
          quiet: 'false'
          soft_fail: true

      - name: Run Snyk to check for vulnerable Terraform modules
        id: snyk-scan
        uses: snyk/actions/iac@master
        with:
          args: --sarif-file-output=snyk-report.snyk.scan
               --severity-threshold=low
          sarif: false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: upload snyk report
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: snyk-report.snyk.scan
          category: 'snyk-iac'
          if-no-files-found: warn

      


################################################################
  # policy enforcement , Drift Detection, and cost estimation
##############################################################
  policy-and-compliance:
    runs-on: ubuntu-latest
    name: ' Policy Enforcement, Drift Detection, and Cost Estimation'
    needs: [formatting-validate-linting]
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=true -input=false

        
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -out=tfplan \
            -no-color \
            -input=false \
            -lock-timeout=300s \
            -detailed-exitcode 
          echo "exitcode=$?" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: false

      - name: Convert Plan to JSON     
        if: steps.plan.outputs.exitcode == '2'
        id: plan-json
        run: |
          terraform show -no-color -json tfplan > tfplan.json
          terraform show -no-color tfplan > tfplan.txt
          echo "Plan generated successfully"
          echo "resources_to_add=$(cat tfplan.json | jq '[.resource_changes[] | select(.change.actions[] == "create")] | length')" >> $GITHUB_OUTPUT
          echo "resources_to_change=$(cat tfplan.json | jq '[.resource_changes[] | select(.change.actions[] == "update")] | length')" >> $GITHUB_OUTPUT
          echo "resources_to_destroy=$(cat tfplan.json | jq '[.resource_changes[] | select(.change.actions[] == "delete")] | length')" >> $GITHUB_OUTPUT

      - name: Upload Terraform Plan Output
        if: steps.plan-json.outcome == 'success' && steps.plan-json.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.json
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
          retention-days: 5

      - name: Detect Infrastructure Drift
        id: drift
        run: |
          terraform plan -detailed-exitcode -no-color -input=false -lock-timeout=300s -out=tfplan
        continue-on-error: true

      - name: Check Drift Status
        run: |
          if [ "${{ steps.drift.outcome }}" == "failure" ]; then
          echo " Drift detected in infrastructure"
          echo "::warning::Drift detected! Infrastructure has diverged from desired state."
          else
          echo " No drift detected"
          echo "::notice::No drift detected. Infrastructure matches desired state."
          fi
             
         

      
      # - name: Comment Terraform Plan on PR       
      #   if: github.event_name == 'pull_request'        
      #   uses: marocchino/sticky-pull-request-comment@v2        
      #   with:
      #     header: terraform plan result
      #     message: |
      #       ```terraform
      #       ${{ steps.plan.outputs.stdout }}
      #       ```
      
      - name: Setup Open Policy Agent (Opa)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Validate Rego Syntax
        id: opa-syntax
        run: |
          echo "Validating OPA policy syntax..."
          opa check policies/ --format pretty
          echo "::notice::All Rego policies passed syntax validation."
      

      - name: Run OPA tests
        id: opa-tests
        run: | 
          echo "Running OPA unit tests..."
         
          opa test policies/ \
            --verbose \
            --format pretty 2>&1 | tee opa-unit-test-results.txt


            

      # - name: Generate Policy Documentation
      #   if: github.ref == 'refs/heads/main'
      #  opa test policies/ --verbose
      #   run: |
      #     mkdir -p docs
      #     for f in policies/**/*.rego; do
      #       echo "# $(basename ${f%.*})" >> docs/policies.md
      #       echo '```rego' >> docs/policies.md
      #       cat $f >> docs/policies.md
      #       echo '```' >> docs/policies.md
      #       echo "" >> docs/policies.md
      #     done
     

#####################################
  # Unit Testing  
#####################################
  unit-and-integration-testing:
    runs-on: ubuntu-latest
    name: 'Unit Testing'
    needs: [formatting-validate-linting] 
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -backend=false          
       

      - name: Run Terraform Native Tests
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend=false
          terraform test
        continue-on-error: true
    
  
#####################################
  #  Review and manual approval
#####################################
  manual-approval:
    runs-on: ubuntu-latest
    name: 'Manual Approval'
    needs: 
      - policy-and-compliance
      - unit-and-integration-testing
    if: success()

    permissions:
      issues: write
    steps:
    
    - name: Await Manual Approval
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.TOKEN }}
        approvers: kodcapsule
        minimum-approvals: 1
        issue-title: "Deploying v1.3.5 to prod from staging"
        issue-body: "Please approve or deny the deployment of version v1.3.5."
        exclude-workflow-initiator-as-approver: false
        
      
        
  

# #####################################
#   # Deployment infrastructure
# #####################################

  deploy-infrastructure:
    runs-on: ubuntu-latest
    name: 'Terraform Apply'
    needs: manual-approval    
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -backend=true -input=false

      - name: Generate Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color -input=false -lock-timeout=300s
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false -lock-timeout=300s tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
      